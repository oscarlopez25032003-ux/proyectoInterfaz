<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <div class="tarjeta-login">
        <h2 class="titulo-login">Iniciar Sesión</h2>

        <form action="login.php" method="POST" class="formulario">
            
            <div class="campo-grupo">
                <label class="etiqueta">Email</label>
                <input type="email" name="email" class="casilla" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="campo-grupo">
                <label class="etiqueta">Contraseña</label>
                <input type="password" name="password" class="casilla" placeholder="••••••••" required>
            </div>

            <div class="contenedor-botones">
                <button type="submit" class="boton boton-enviar">Enviar</button>
                <button type="reset" class="boton boton-limpiar">Limpiar</button>
            </div>

        </form>
    </div>

</body>
</html>
